services:
  open-timer:
    build: .
    ports:
      - "${CLOCK_BIND_ADDRESS:-127.0.0.1}:${CLOCK_PORT:-4517}:4517"
    environment:
      NODE_ENV: production
      # Compose is intentionally served on localhost HTTP. Set true behind HTTPS.
      CLOCK_COOKIE_SECURE: ${CLOCK_COOKIE_SECURE:-false}
      CLOCK_DATA_DIR: /data
      CLOCK_INITIAL_OWNER_PIN: ${CLOCK_INITIAL_OWNER_PIN:?Set a unique six-digit owner PIN in .env}
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?Set a long random value in .env}
    volumes:
      - open-timer-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4517/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  open-timer-data:
