openapi: 3.1.0
info:
  title: 11408 Immersive Clock API
  version: 1.1.0
  description: |
    单用户学习计时器的版本化 HTTP API。
    所有持久化时间戳为 UTC；自然日、显示与汇总一律 Asia/Shanghai（固定 UTC+8）。
    API 只返回时长事实，不输出掌握、完成度或评价。

    ## 幂等契约
    所有会话写操作（start / pause / resume / stop / switch / void / note / retime /
    adjust-start）必须携带 `Idempotency-Key` 请求头（8–64 字符，客户端生成 UUID）。
    服务端按「端点:键」保存响应 24h；同键重试回放原状态码与原响应体，并返回
    `Idempotent-Replay: true`。缺失键返回 400 `IDEMPOTENCY_KEY_REQUIRED`。
    auth 与 credentials 端点是连接与凭据管理而非资源变更，不要求幂等键，由限流保护。

    ## 安全头
    所有响应（含静态资源与错误响应）统一携带 CSP（script-src 'self'，无内联脚本）、
    X-Frame-Options: DENY、nosniff、Referrer-Policy: no-referrer；生产环境追加 HSTS。
servers:
  - url: /api/v1

security:
  - owner-cookie: []

components:
  securitySchemes:
    owner-cookie:
      type: apiKey
      in: cookie
      name: clock_session
      description: owner 登录后下发的 HttpOnly 会话 cookie；仅写操作需要。
    # 注意：只读端点（GET health/subjects/state/sessions/daily-summary）完全公开，无需任何凭据，
    # 各端点处显式标注 security: []。

  parameters:
    idempotency-key:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的唯一键（UUID）；同键重试回放原状态码与原响应体。
      schema: { type: string, minLength: 8, maxLength: 64 }

  schemas:
    SubjectEntry:
      type: object
      required: [subject_id, display_name, aggregate_group, color_id, sort_order]
      properties:
        subject_id:
          type: string
          enum: [math, english, data-structures, computer-organization, operating-systems, computer-networks, politics]
        display_name: { type: string }
        aggregate_group:
          type: string
          enum: [math, english, 408, politics]
        color_id: { type: string }
        sort_order: { type: integer }

    SessionEntry:
      type: object
      required: [session_id, subject_id, started_at, active_seconds, status]
      properties:
        session_id: { type: string }
        subject_id: { type: string }
        started_at: { type: string, format: date-time, description: UTC ISO 8601 }
        ended_at: { type: [string, 'null'], format: date-time }
        active_seconds: { type: integer, description: 当日窗口内净秒数 }
        status: { type: string, enum: [running, paused, stopped, voided] }
        end_reason: { type: [string, 'null'], enum: [manual, subject_switch, void, null] }
        note: { type: [string, 'null'] }

    RangeSessionEntry:
      type: object
      required: [session_id, subject_id, started_at, active_seconds, window_active_seconds, session_active_seconds, longest_continuous_seconds, last_continuous_seconds, status, segments]
      properties:
        session_id: { type: string }
        subject_id: { type: string, enum: [math, english, data-structures, computer-organization, operating-systems, computer-networks, politics] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        active_seconds: { type: integer, description: 兼容字段，等同 window_active_seconds }
        window_active_seconds: { type: integer, description: 查询 date/from-to 北京窗口内净秒数 }
        session_active_seconds: { type: integer, description: 该会话全量净秒数，不按查询窗口裁剪 }
        longest_continuous_seconds: { type: integer, description: 所有计入段中最长连续段秒数 }
        last_continuous_seconds: { type: integer, description: 最后一个计入段秒数 }
        last_continuous_ended_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [running, paused, stopped, voided] }
        end_reason: { type: [string, 'null'], enum: [manual, subject_switch, void, null] }
        intent_note: { type: [string, 'null'] }
        end_note: { type: [string, 'null'] }
        note: { type: [string, 'null'], description: 兼容字段，优先 end_note 否则 intent_note }
        segments:
          type: array
          description: 按查询北京窗口裁剪的段；跨日范围中同一 session 只出现一次
          items:
            type: object
            required: [started_at, ended_at]
            properties:
              started_at: { type: string, format: date-time }
              ended_at: { type: [string, 'null'], format: date-time }

    ReadAdjustmentEntry:
      type: object
      required: [session_id, subject_id, status, kind, at]
      properties:
        session_id: { type: string }
        subject_id: { type: string }
        status: { type: string, enum: [running, paused, stopped, voided] }
        kind: { type: string, enum: [retime, void, note] }
        reason: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    RangeSessionsResponse:
      type: object
      required: [from, to, timezone, generated_at, revision, count, sessions, adjustments_or_revocations]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 仅兼容旧单日调用时存在 }
        from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        to: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string, const: Asia/Shanghai }
        generated_at: { type: string, format: date-time }
        revision: { type: integer }
        count: { type: integer }
        sessions:
          type: array
          description: 默认不含 voided；按 started_at、session_id 稳定升序
          items: { $ref: '#/components/schemas/RangeSessionEntry' }
        adjustments_or_revocations:
          type: array
          description: 关联会话的修正/撤回审计摘要，voided 默认不在 sessions 但在这里可见
          items: { $ref: '#/components/schemas/ReadAdjustmentEntry' }

    DailyRangeDay:
      type: object
      required: [date, total_active_seconds, by_subject, aggregates, session_count]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        total_active_seconds: { type: integer }
        by_subject:
          type: array
          items:
            type: object
            required: [subject_id, display_name, active_seconds, session_count]
            properties:
              subject_id: { type: string }
              display_name: { type: string }
              active_seconds: { type: integer }
              session_count: { type: integer }
        aggregates:
          type: array
          items:
            type: object
            required: [group, active_seconds]
            properties:
              group: { type: string, enum: [math, english, 408, politics] }
              active_seconds: { type: integer }
        session_count: { type: integer, description: 当日有正净秒数的会话数量 }

    DailySummariesResponse:
      type: object
      required: [from, to, timezone, generated_at, revision, total_active_seconds, by_subject, aggregates, active_dates, days]
      properties:
        from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        to: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string, const: Asia/Shanghai }
        generated_at: { type: string, format: date-time }
        revision: { type: integer }
        total_active_seconds: { type: integer }
        by_subject:
          type: array
          items:
            type: object
            required: [subject_id, display_name, active_seconds]
            properties:
              subject_id: { type: string }
              display_name: { type: string }
              active_seconds: { type: integer }
        aggregates:
          type: array
          items:
            type: object
            required: [group, active_seconds]
            properties:
              group: { type: string, enum: [math, english, 408, politics] }
              active_seconds: { type: integer }
        active_dates: { type: array, items: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        days: { type: array, items: { $ref: '#/components/schemas/DailyRangeDay' } }

    SessionWriteResult:
      type: object
      description: 写操作成功后的会话快照
      required: [session_id, subject_id, status, started_at, active_seconds]
      properties:
        session_id: { type: string }
        subject_id: { type: string }
        status: { type: string, enum: [running, paused, stopped, voided] }
        intent_note: { type: [string, 'null'] }
        end_note: { type: [string, 'null'] }
        end_reason: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        active_seconds: { type: integer, description: 会话总净秒数（不按日裁剪） }

    RunningSessionEntry:
      type: object
      required: [session_id, subject_id, started_at, status, active_seconds]
      properties:
        session_id: { type: string }
        subject_id: { type: string }
        started_at: { type: string, format: date-time }
        status: { type: string, enum: [running, paused] }
        active_seconds: { type: integer, description: 截至 generated_at 的暂算净秒数 }
        current_segment_started_at: { type: [string, 'null'], format: date-time }
        current_segment_active_seconds:
          type: [integer, 'null']
          description: 本段秒数：running 持续增长，paused 冻结为末段净秒
        paused_at: { type: [string, 'null'], format: date-time, description: 暂停（离开）开始时刻 }
        intent_note: { type: [string, 'null'] }

    AdjustmentEntry:
      type: object
      required: [session_id, kind, at]
      properties:
        session_id: { type: string }
        kind: { type: string, enum: [retime, void, note], description: adjust-start 以 retime 类别入账 }
        reason: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    DailySummary:
      type: object
      required: [date, timezone, revision, generated_at, total_active_seconds, by_subject, aggregates, sessions, adjustments_or_revocations]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string, const: Asia/Shanghai }
        revision: { type: integer, description: 审计日志序号；同 date/revision 响应确定（覆盖所有写操作） }
        generated_at: { type: string, format: date-time }
        total_active_seconds: { type: integer }
        by_subject:
          type: array
          items:
            type: object
            required: [subject_id, display_name, active_seconds, session_count]
            properties:
              subject_id: { type: string }
              display_name: { type: string }
              active_seconds: { type: integer }
              session_count: { type: integer }
        aggregates:
          type: array
          description: math / english / 408（四模块之和）/ politics
          items:
            type: object
            required: [group, active_seconds]
            properties:
              group: { type: string, enum: [math, english, 408, politics] }
              active_seconds: { type: integer }
        sessions:
          type: array
          description: voided 会话完全排除，不出现在本数组；仅经 adjustments_or_revocations 可见
          items: { $ref: '#/components/schemas/SessionEntry' }
        running_session:
          oneOf: [{ $ref: '#/components/schemas/RunningSessionEntry' }, { type: 'null' }]
        adjustments_or_revocations:
          type: array
          description: 仅收录会话开始于查询日窗口内的条目
          items: { $ref: '#/components/schemas/AdjustmentEntry' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            错误码：INVALID_BODY / INVALID_DATE / INVALID_DATE_RANGE / INVALID_FILTER / INVALID_ID / INVALID_DELTA /
            TIMEZONE_MUST_BE_ASIA_SHANGHAI / UNAUTHORIZED / INVALID_CREDENTIALS /
            SESSION_NOT_FOUND / ACTIVE_SESSION_EXISTS / ILLEGAL_TRANSITION /
            ALREADY_SETUP / NOT_SETUP / NOT_ACTIVE_SESSION / INVALID_START /
            IDEMPOTENCY_KEY_REQUIRED / RATE_LIMITED / CSRF_REJECTED / NOT_FOUND / INTERNAL

paths:
  /health:
    get:
      summary: 健康检查（无鉴权）
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  server_time: { type: string, format: date-time }
                  version: { type: string }

  /subjects:
    get:
      summary: 7 科目固定表（公开只读，无需认证）
      security: []
      responses:
        '200':
          description: 科目列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubjectEntry' }

  /state:
    get:
      summary: 当前实时状态（公开只读）：是否在计时、今日累计、本段秒数
      security: []
      responses:
        '200':
          description: 状态快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_now_ms: { type: integer }
                  server_now_iso: { type: string, format: date-time }
                  active_session:
                    oneOf: [{ $ref: '#/components/schemas/RunningSessionEntry' }, { type: 'null' }]
                  today_active_seconds: { type: integer }
                  today_date: { type: string }
                  revision: { type: integer, description: 通用审计 revision，非海螺缓存键 }
                  conch_revision: { type: integer, description: 已完成时间线 semantic revision }
                required: [server_now_ms, server_now_iso, active_session, today_active_seconds, today_date, revision, conch_revision]

  /snapshot:
    get:
      summary: SPA 原子刷新快照（公开只读）：一次返回同次 state 与当天 sessions
      security: []
      responses:
        '200':
          description: 前端刷新快照
          content:
            application/json:
              schema:
                type: object
                required: [state, sessions]
                properties:
                  state:
                    type: object
                    properties:
                      server_now_ms: { type: integer }
                      server_now_iso: { type: string, format: date-time }
                      active_session:
                        oneOf: [{ $ref: '#/components/schemas/RunningSessionEntry' }, { type: 'null' }]
                      today_active_seconds: { type: integer }
                      today_date: { type: string }
                      revision: { type: integer }
                      conch_revision: { type: integer }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/RangeSessionEntry' }

  /daily-summary:
    get:
      summary: 北京时间某日学习时长汇总（公开只读；Agent 每晚约 22:30 调用）
      security: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: timezone
          in: query
          required: true
          description: 只接受 Asia/Shanghai；日切口径由服务端统一实现。
          schema: { type: string, enum: [Asia/Shanghai] }
      responses:
        '200':
          description: 当日汇总
          headers:
            ETag:
              description: W/"<date>-<revision>"；配合 If-None-Match 使用
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySummary' }
        '304': { description: revision 未变化 }
        '400': { description: date 或 timezone 非法 }

  /sessions:
    get:
      summary: 单日或最多 31 日会话明细（含裁剪 segment；公开只读）
      security: []
      parameters:
        - name: date
          in: query
          required: false
          description: 兼容单日调用；与 from/to 互斥
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: from
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: subject_id
          in: query
          required: false
          schema: { type: string, enum: [math, english, data-structures, computer-organization, operating-systems, computer-networks, politics] }
        - name: aggregate_group
          in: query
          required: false
          schema: { type: string, enum: [math, english, 408, politics] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [running, paused, stopped] }
        - name: has_note
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: 会话列表；范围请求可用 ETag，运行中会话与范围相交时不返回 304
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RangeSessionsResponse' }
        '304': { description: 无运行中会话且 revision 未变化 }
        '400': { description: 日期范围、过滤器或互斥参数非法 }
    post:
      summary: 开始计时（幂等）
      parameters:
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string }
                intent_note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '201':
          description: 新会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionWriteResult' }
        '400': { description: 参数非法或缺 Idempotency-Key }
        '409': { description: 已有活动会话（ACTIVE_SESSION_EXISTS） }

  /daily-summaries:
    get:
      summary: 最多 31 日的批量北京日报（公开只读；不返回完整 sessions）
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: timezone
          in: query
          required: true
          schema: { type: string, enum: [Asia/Shanghai] }
      responses:
        '200':
          description: 范围汇总；空日期显式返回 0
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySummariesResponse' }
        '304': { description: 无运行中会话与范围相交且 revision 未变化 }
        '400': { description: 日期范围（最大 31 日）或 timezone 非法 }

  /conch/revision:
    get:
      summary: 神奇海螺已完成时间线缓存版本（owner）
      responses:
        '200':
          description: 一行 semantic revision；不读取完整时间线、不调用模型
          content:
            application/json:
              schema:
                type: object
                required: [conch_revision, model]
                properties:
                  conch_revision: { type: integer }
                  model: { type: [string, 'null'], description: 当前建议模型标识；仅用于客户端缓存失效，不含密钥 }
        '401': { description: 未登录 }

  /conch/ask:
    post:
      summary: 神奇海螺下一步建议（owner；LLM 只读取已完成、计入的时间线事实）
      parameters:
        - name: X-Client-Request-Id
          in: header
          required: false
          description: 浏览器诊断关联号；仅接受 conch- 前缀的小写字母数字分段值，合法值在响应头回显。
          schema: { type: string, minLength: 14, maxLength: 72, pattern: '^conch-[a-z0-9]+(?:-[a-z0-9]+)*$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [window]
              properties:
                window: { type: string, enum: [all, 30d, 7d] }
                force: { type: boolean, description: 显式重新问一次；绕过同键缓存并以新结果覆盖它 }
      responses:
        '200':
          description: 结构化建议；conch_revision 与 cache_valid_until 共同决定本地缓存是否仍可使用
          content:
            application/json:
              schema:
                type: object
                required: [window, generated_at, cache_valid_until, conch_revision, revision, model, subjects, skipped]
                properties:
                  window: { type: string, enum: [all, 30d, 7d] }
                  generated_at: { type: string, format: date-time }
                  cache_valid_until: { type: string, format: date-time, description: 当前建议输入最早变化的时刻，最晚不跨下一个北京时间自然日；到达后必须重新校验 }
                  conch_revision: { type: integer }
                  revision: { type: integer }
                  model: { type: string }
                  subjects: { type: array, items: { type: object } }
                  skipped: { type: array, items: { type: object } }
        '400': { description: window 非法 }
        '401': { description: 未登录 }
        '402': { description: 上游推理额度不足（CONCH_QUOTA_EXHAUSTED） }
        '409': { description: 同一 conch_revision + model + window 正在生成，或生成期间 completed timeline 已改变；响应含 retry_after_ms，客户端应等待后重试 }
        '422': { description: LLM 输出不符合契约 }
        '429': { description: 请求过频 }
        '500': { description: 未预期内部错误（INTERNAL；不含上游响应或栈信息） }
        '502': { description: LLM 上游错误 }
        '503': { description: 未配置模型，或上游 API 凭据失效（CONCH_CREDENTIAL_INVALID） }
        '504': { description: LLM 超时 }

  /sessions/{id}/pause:
    post:
      summary: 暂停（幂等）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      responses:
        '200': { description: 已暂停 }
        '400': { description: 缺 Idempotency-Key 或 id 非法 }
        '404': { description: 会话不存在 }
        '409': { description: 非法状态转移 }

  /sessions/{id}/resume:
    post:
      summary: 继续（幂等）。误触保护：stopped 会话可重开（清结束时刻、保留原段与秒数、开新段）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      responses:
        '200': { description: 已继续（重开 stopped 时 payload 带 reopened_from） }
        '400': { description: 缺 Idempotency-Key 或 id 非法 }
        '404': { description: 会话不存在 }
        '409': { description: 非法状态转移，或重开 stopped 会话时已有其他活动会话（ACTIVE_SESSION_EXISTS） }

  /sessions/{id}/stop:
    post:
      summary: 结束并保存（幂等）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                end_note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200': { description: 已结束 }
        '400': { description: 缺 Idempotency-Key 或 id 非法 }
        '404': { description: 会话不存在 }
        '409': { description: 非法状态转移 }

  /sessions/{id}/switch:
    post:
      summary: 换科目（幂等）：结束当前会话（subject_switch）并开启新会话
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string }
                intent_note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200':
          description: "{ stopped: 旧会话快照, started: 新会话快照 }"
        '400': { description: 缺 Idempotency-Key 或参数非法 }
        '409': { description: 该会话不是当前活动会话（NOT_ACTIVE_SESSION） }

  /sessions/{id}/void:
    post:
      summary: 作废已停止会话（幂等；保留审计，汇总排除）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200': { description: 已作废 }
        '400': { description: 缺 Idempotency-Key 或 id 非法 }
        '404': { description: 会话不存在 }
        '409': { description: 仅 stopped 可作废 }

  /sessions/{id}/note:
    patch:
      summary: 更新已停止会话备注（幂等）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: 已更新 }
        '400': { description: 缺 Idempotency-Key 或参数非法 }
        '404': { description: 会话不存在 }
        '409': { description: 仅 stopped 可改备注 }

  /sessions/{id}/retime:
    post:
      summary: 修正时长（幂等；delta 落到末段结束时刻，审计留痕，±24h 内）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta_seconds, reason]
              properties:
                delta_seconds: { type: integer, minimum: -86400, maximum: 86400 }
                reason: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200': { description: 已修正（末段结束时刻调整，汇总按段重算反映） }
        '400': { description: 缺 Idempotency-Key、参数非法，或使末段时长为负（INVALID_RETIME） }
        '404': { description: 会话不存在 }
        '409': { description: 仅 stopped 可修正 }

  /sessions/{id}/adjust-start:
    post:
      summary: 起点补录（幂等）：把已停止会话的开始时间向前调整，同步首段与净时长
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at, reason]
              properties:
                started_at: { type: string, format: date-time, description: 必须早于首段结束时刻 }
                reason: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200': { description: 已补录 }
        '400': { description: 缺 Idempotency-Key、参数非法或起点无效（INVALID_START） }
        '404': { description: 会话不存在 }
        '409': { description: 仅 stopped 可补录 }

  /auth/setup:
    post:
      summary: 首次设置 owner PIN（6 位数字；成功后直接登录）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: 已设置并下发会话 cookie }
        '400': { description: PIN 格式非法 }
        '409': { description: 已设置过（ALREADY_SETUP） }

  /auth/login:
    post:
      summary: 登录（限流保护，不要求幂等键）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: 登录成功 }
        '401': { description: 密码错误 }
        '409': { description: 尚未设置（NOT_SETUP） }
        '429': { description: 尝试过频 }

  /auth/logout:
    post:
      summary: 登出（删除服务端会话记录）
      responses:
        '200': { description: 已登出 }
        '401': { description: 未登录 }

  /auth/me:
    get:
      summary: 鉴权探测（公开）：是否已登录、是否已完成初始设置
      security: []
      responses:
        '200':
          description: "{ authenticated: boolean, setup_done: boolean }"

  /credentials:
    get:
      summary: 列出总控只读凭据（owner；token 本体不返回）
      responses:
        '200': { description: 凭据列表 }
        '401': { description: 未登录 }
    post:
      summary: 创建总控只读凭据（owner；token 只显示一次，不要求幂等键）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201': { description: "{ id, name, token }" }
        '401': { description: 未登录 }

  /credentials/{id}/revoke:
    post:
      summary: 撤销总控凭据（owner；轮换 = 新建 + 撤销）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已撤销 }
        '401': { description: 未登录 }

  /export/events.jsonl:
    get:
      summary: 事件级全量导出（owner；可重放重建一切）
      responses:
        '200':
          description: NDJSON 事件流
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { description: 未登录 }
